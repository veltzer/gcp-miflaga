gcp_project=veltzer-miflaga-id

# Where and how the app is deployed by gcloud_deploy.sh (utils-bash);
# gcloud_project_setup.sh enables the APIs it needs.
gcp_service=miflaga
gcp_region=us-central1
# Custom domain, bought at Cloudflare; mapped with gcloud_run_domain.sh, the
# DNS records live at Cloudflare (see doc/deploy.md).
gcp_domain=miflaga.online
# More hostnames the site is served on as it is, each with its own Cloud Run
# domain mapping and DNS record (see doc/deploy.md); space separated.
gcp_alias_domains="miflaga.veltzer.org"
gcp_run_args=(
	--allow-unauthenticated
	--max-instances 2
)
