gcp_configuration_name=miflaga

# Where and how the app is deployed by gcloud_run_deploy.sh (utils-bash);
# gcloud_project_setup.sh enables the APIs it needs.
gcp_service=miflaga
gcp_region=us-central1
# Custom domain, bought at Cloudflare; mapped with gcloud_run_domain.sh, the
# DNS records live at Cloudflare (see doc/deploy.md).
gcp_domain=miflaga.online
gcp_run_args=(
	--allow-unauthenticated
	--max-instances 2
)
