gcp_project=veltzer-miflaga-id

# Where and how the app is deployed by gcloud_deploy.sh (utils-bash);
# gcloud_project_setup.sh enables the APIs it needs.
gcp_service=miflaga
gcp_region=us-central1
# The one address of the site: a custom domain bought at Cloudflare, mapped
# with gcloud_run_domain.sh. The app gets it as CANONICAL_HOST and redirects
# every other hostname it is reached on to it: the run.app ones Cloud Run
# adds and miflaga.veltzer.org, which has a domain mapping of its own (see
# doc/addresses.md).
gcp_domain=miflaga.online
gcp_run_args=(
	--allow-unauthenticated
	--max-instances 2
	--set-env-vars "CANONICAL_HOST=${gcp_domain}"
)
